site_name: Organic
site_description: Documentation for the Organic image reconstruction package.
site_author: Toon De Prins
site_url: https://organic.readthedocs.io/en/latest/

# Github repo information.
repo_url: https://github.com/DePrinsT/organic
repo_name: DePrinsT/organic

# Don't complete build with warnings.
strict: true

theme:
  name: material
  logo: "assets/organic_logo.png"
  favicon: "assets/organic_logo.png"
  features:
      - navigation.sections  # Sections are included in the navigation on the left.
#      - toc.integrate  # Table of contents is integrated on the left; does not appear separately on the right.
      - header.autohide  # Header disappears as you scroll.
      - content.code.copy
  palette:
      # Light mode / dark mode
      - scheme: default
        primary: teal
        accent: teal
        toggle:
            icon: material/weather-night
            name: Switch to dark mode
      - scheme: slate
        primary: black
        accent: amber
        toggle:
            icon: material/weather-sunny
            name: Switch to light mode


extra_css:
    - stylesheets/custom_style.css

# NOTE: currently full jupyter notebook support is not yet included. This just
# adds a download link to the notebooks.
nav:
  - Home: index.md
  - Example notebooks:
        - "Loading training data": examples/data_loader.ipynb
        - "Calculating complex visibilities": examples/calculate_complex_visibilities.ipynb
  - API:
        - Training data: api/training_data.md
        - Model training: api/model_training.md
        - SPARCO: api/sparco.md
        - Utilities: api/utils.md

plugins:
    - search
    - mkdocstrings:
        handlers:
            python:
                paths: [src]
                options:
                    show_root_heading: true
                    show_root_full_path: false
                    show_signature_annotations: true
                    filters:
                        - ""
    - mkdocs-ipynb:      # Activates notebook rendering
        execute: false      # Do not runs code cells to generate fresh outputs on build.
        include_source: true # Automatically put a "Download .ipynb" button on top.

markdown_extensions:
  - pymdownx.arithmatex:  # Math mode.
      generic: true
  - admonition  # Admonitions like 'warning'
  - toc:
      permalink: true
      title: "Table of contents"
      toc_depth: 3


extra_javascript:
  - javascripts/mathjax.js  # For math mode.
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js  # For math mode.

